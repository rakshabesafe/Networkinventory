version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  tmf639-service:
    build:
      context: .
      dockerfile: services/tmf639/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      neo4j:
        condition: service_healthy

  tmf638-service:
    build:
      context: .
      dockerfile: services/tmf638/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      neo4j:
        condition: service_healthy

  adapter-service:
    build:
      context: .
      dockerfile: services/adapter/Dockerfile
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      neo4j:
        condition: service_healthy
      tmf639-service:
        condition: service_started

  reconciliation-service:
    build:
      context: .
      dockerfile: services/reconciliation/Dockerfile
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
